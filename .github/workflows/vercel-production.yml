name: vercel-production

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful push/master CI run ID for this exact master SHA
        required: true
        type: string
      ci_run_attempt:
        description: Exact completed CI attempt number
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    env:
      RIDEFARE_PROJECT_ROOT: ${{ github.workspace }}
    outputs:
      artifact_id: ${{ steps.bundle-upload.outputs.artifact-id }}
      zip_digest: ${{ steps.bundle-upload.outputs.artifact-digest }}
      package_sha256: ${{ steps.bundle.outputs.package_sha256 }}

    steps:
      - name: Validate exact CI attempt
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
        run: |
          python3 -I -B - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repository = "Sam-24-dev/RideFare-ETL-Pipeline"
          api = f"https://api.github.com/repos/{repository}"

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          require(os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch", "Manual runs only")
          require(os.environ.get("GITHUB_REPOSITORY") == repository, "Wrong repository")
          require(os.environ.get("GITHUB_REF") == "refs/heads/master", "master only")
          sha = os.environ.get("GITHUB_SHA", "")
          require(re.fullmatch(r"[0-9a-f]{40}", sha), "Invalid master SHA")
          run_id = os.environ.get("CI_RUN_ID", "")
          attempt = os.environ.get("CI_RUN_ATTEMPT", "")
          require(re.fullmatch(r"[1-9][0-9]*", run_id), "Invalid CI run ID")
          require(re.fullmatch(r"[1-9][0-9]*", attempt), "Invalid CI attempt")
          expected = {
              "id": int(run_id), "run_attempt": int(attempt), "workflow_id": 256052140,
              "path": ".github/workflows/ci.yml", "event": "push", "head_branch": "master",
              "head_sha": sha, "status": "completed", "conclusion": "success",
          }

          def get(path):
              request = urllib.request.Request(api + path, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2026-03-10",
              }, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.load(response)
              except (OSError, ValueError):
                  raise SystemExit(f"GitHub GET failed: {path}") from None
              require(isinstance(data, dict), "Invalid GitHub response")
              return data

          def validate_run(run):
              require(all(run.get(key) == value for key, value in expected.items()),
                      "CI must be this exact successful push/master run and attempt")
              for field in ("repository", "head_repository"):
                  require(run.get(field, {}).get("full_name") == repository, "Foreign CI repository")

          require(get("/git/ref/heads/master").get("object", {}).get("sha") == sha, "master moved")
          run = get(f"/actions/runs/{run_id}/attempts/{attempt}")
          validate_run(run)
          suite = run.get("check_suite_id")
          require(isinstance(suite, int) and suite > 0, "Missing CI check suite")
          result = get(f"/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100")
          jobs = result.get("jobs", [])
          require(result.get("total_count") == len(jobs) == 2, "Incomplete or unexpected CI jobs")
          require({job.get("name") for job in jobs} == {"python-quality", "web-quality"},
                  "Required CI job names differ")
          for job in jobs:
              require(job.get("run_id") == int(run_id) and job.get("run_attempt") == int(attempt)
                      and job.get("head_sha") == sha and job.get("status") == "completed"
                      and job.get("conclusion") == "success", "CI job is not approved")
              match = re.fullmatch(re.escape(api) + r"/check-runs/([1-9][0-9]*)",
                                   job.get("check_run_url", ""))
              require(match, "Foreign or invalid CI check URL")
              check = get(f"/check-runs/{match.group(1)}")
              require(check.get("id") == int(match.group(1)) and check.get("name") == job["name"]
                      and check.get("head_sha") == sha and check.get("status") == "completed"
                      and check.get("conclusion") == "success" and check.get("app", {}).get("id") == 15368
                      and check.get("check_suite", {}).get("id") == suite, "CI check is not approved")
          latest = get(f"/actions/runs/{run_id}")
          validate_run(latest)
          require(latest.get("check_suite_id") == suite, "CI check suite changed")
          require(get("/git/ref/heads/master").get("object", {}).get("sha") == sha, "master moved")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha={sha}\n")
          print(f"Validated CI {run_id}, attempt {attempt}, master {sha}; build only")
          PY

      - name: Checkout validated revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.ci.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[data,ml,dev]

      - name: Refresh public artifacts
        shell: pwsh
        run: ./scripts/refresh-public-artifacts.ps1 -RunId production-${{ github.run_number }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@50.39.0

      - name: Prepare public Vercel settings
        shell: bash
        run: |
          test ! -e .vercel
          test ! -e "$RUNNER_TEMP/ridefare-vercel-build"
          mkdir .vercel "$RUNNER_TEMP/ridefare-vercel-build"
          cat > .vercel/project.json <<'JSON'
          {
            "projectId": "prj_tS8gW1XL7PuYmvH3rD3ATUh6MTEO",
            "orgId": "team_FO5NX52lZMHAG9a8lgb7Zczq",
            "projectName": "ride-fare-etl-pipeline-web",
            "settings": {
              "createdAt": 1775274106564,
              "framework": "nextjs",
              "devCommand": null,
              "installCommand": null,
              "buildCommand": null,
              "outputDirectory": null,
              "rootDirectory": "apps/web",
              "directoryListing": false,
              "nodeVersion": "22.x"
            }
          }
          JSON

      - name: Build production bundle
        shell: bash
        run: |
          printf '%s\n' '9bb39ac69d8dc234cd93183b48c49995f678d50b135d4409bfa7603b999938e6  .vercel/project.json' | sha256sum --check --status
          vercel build --prod --global-config "$RUNNER_TEMP/ridefare-vercel-build"

      - name: Package production output
        id: bundle
        shell: bash
        env:
          BUNDLE_MODE: pack
          BUNDLE_DIR: ${{ runner.temp }}/ridefare-transfer-upload
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
        run: &bundle-transfer |
          python3 -I -B - <<'PY'
          import hashlib
          import io
          import json
          import math
          import os
          import posixpath
          import re
          import stat
          import tarfile
          import urllib.request
          from pathlib import Path, PurePosixPath

          REPOSITORY = "Sam-24-dev/RideFare-ETL-Pipeline"
          SETTINGS_SHA256 = "9bb39ac69d8dc234cd93183b48c49995f678d50b135d4409bfa7603b999938e6"
          MAX_BYTES, MAX_PACKAGE, MAX_ENTRIES = 64 * 1024**2, 80 * 1024**2, 4096
          MAX_RECEIPT = 2 * 1024**2
          PACKAGE = "production-bundle.tar"
          BUILDS_PATH = "output/builds.json"
          BUILDS_JSON = b'{"target":"production"}'
          TRACE_PATH = "output/static/_next/__private/trace"
          TAR_TYPES = {"file": tarfile.REGTYPE, "directory": tarfile.DIRTYPE,
                       "func-alias": tarfile.SYMTYPE}

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def digest(stream):
              return hashlib.file_digest(stream, "sha256").hexdigest()

          def file_digest(path):
              with path.open("rb") as stream:
                  return digest(stream)

          def regular_state(info):
              require(stat.S_ISREG(info.st_mode) and type(info.st_nlink) is int
                      and info.st_nlink > 0 and info.st_dev >= 0 and info.st_ino > 0
                      and info.st_size >= 0, "Invalid regular file metadata")
              return (info.st_dev, info.st_ino, info.st_mode, info.st_nlink,
                      info.st_size, info.st_mtime_ns, info.st_ctime_ns)

          def source_stat(path):
              try:
                  return path.lstat()
              except OSError:
                  raise SystemExit("Cannot inspect selected source metadata") from None

          def regular_bytes(path, expected):
              require(regular_state(source_stat(path)) == expected, "Selected regular file changed")
              flags = (os.O_RDONLY | getattr(os, "O_BINARY", 0)
                       | getattr(os, "O_NOFOLLOW", 0) | getattr(os, "O_NONBLOCK", 0))
              try:
                  fd = os.open(path, flags)
              except OSError:
                  raise SystemExit("Cannot open selected regular file") from None
              with os.fdopen(fd, "rb") as stream:
                  require(regular_state(os.fstat(stream.fileno())) == expected
                          and regular_state(source_stat(path)) == expected,
                          "Selected regular file changed before reading")
                  try:
                      data = stream.read(expected[4] + 1)
                  except OSError:
                      raise SystemExit("Cannot read selected regular file") from None
                  require(len(data) == expected[4]
                          and regular_state(os.fstat(stream.fileno())) == expected
                          and regular_state(source_stat(path)) == expected,
                          "Selected regular file changed while reading")
              return data

          def number(name):
              value = os.environ.get(name, "")
              require(re.fullmatch(r"[1-9][0-9]*", value), f"Invalid {name}")
              return int(value)

          def output_path(name):
              require(isinstance(name, str), "Invalid output path type")
              path = PurePosixPath(name)
              require(name.isascii() and 0 < len(name) <= 240
                      and all(32 <= ord(c) < 127 for c in name)
                      and "\\" not in name and ":" not in name
                      and path.as_posix() == name and not path.is_absolute()
                      and ".." not in path.parts and path.parts[0] == "output",
                      "External or unsupported output path")
              require(name != TRACE_PATH and not name.startswith(TRACE_PATH + "/"),
                      "Excluded static trace is not transferable")
              parts = path.parts[1:]
              require(not parts or parts[0] in {"config.json", "builds.json", "static", "functions"},
                      f"Unexpected output entry: {name}")
              require(not any(p in {".git", ".vercel", ".npmrc", ".netrc", "auth.json"}
                              or p == ".env" or p.startswith(".env.") for p in parts),
                      "Authentication or environment file is not transferable")
              try:
                  tarfile.TarInfo(name).tobuf(format=tarfile.USTAR_FORMAT)
              except ValueError:
                  raise SystemExit("Output path cannot be represented in USTAR") from None
              return path

          def alias_target(name, target):
              path = output_path(name)
              require(path.parts[:2] == ("output", "functions") and len(path.parts) > 2
                      and path.name.endswith(".func"), "Unsupported function alias location")
              require(isinstance(target, str) and target.isascii() and 0 < len(target) <= 100
                      and all(32 <= ord(c) < 127 for c in target)
                      and "\\" not in target and ":" not in target
                      and not PurePosixPath(target).is_absolute()
                      and PurePosixPath(target).as_posix() == target, "Invalid relative alias target")
              destination = posixpath.normpath(posixpath.join(path.parent.as_posix(), target))
              require(destination.startswith("output/functions/")
                      and PurePosixPath(destination).name.endswith(".func")
                      and posixpath.relpath(destination, path.parent.as_posix()) == target,
                      "Non-canonical or external function alias target")
              return output_path(destination).as_posix()

          def validate_aliases(entries):
              selected = {entry["path"]: entry for entry in entries}
              for entry in entries:
                  if entry["type"] != "func-alias":
                      continue
                  destination = alias_target(entry["path"], entry["target"])
                  require(selected.get(destination, {}).get("type") == "directory",
                          "Alias target must be a selected real .func directory")
                  for parent in PurePosixPath(destination).parents:
                      if parent.as_posix() != ".":
                          require(selected.get(parent.as_posix(), {}).get("type") == "directory",
                                  "Symbolic or missing alias target parent")

          def inventory(root, *, omit_diagnostics=False):
              entries = []
              file_states = {}  # Per-path stability checks only; never serialized or grouped by inode.
              total = source_total = 0
              diagnostics_state = "absent"
              builds_hash = trace_state = None

              def visit(path, name):
                  nonlocal total, source_total, diagnostics_state, builds_hash, trace_state
                  # Producer selection only; received payloads must never ignore this path.
                  if omit_diagnostics and name == "output/diagnostics":
                      info = source_stat(path)
                      require(stat.S_ISDIR(info.st_mode), "Excluded diagnostics must be a real directory")
                      require(stat.S_IMODE(info.st_mode) & ~0o777 == 0,
                              "Special permission bits are unsupported")
                      diagnostics_state = "omitted"
                      return
                  if omit_diagnostics and name == TRACE_PATH:
                      info = source_stat(path)
                      require(stat.S_IMODE(info.st_mode) & ~0o777 == 0,
                              "Special permission bits are unsupported")
                      trace_state = regular_state(info)
                      return
                  output_path(name)
                  info = source_stat(path)
                  if name == BUILDS_PATH:
                      require(stat.S_ISREG(info.st_mode), "Build metadata must be a regular file")
                  mode = stat.S_IMODE(info.st_mode)
                  require(mode & ~0o777 == 0, "Special permission bits are unsupported")
                  alias = stat.S_ISLNK(info.st_mode)
                  target = os.readlink(path) if alias else None
                  if alias:
                      alias_target(name, target)
                  directory = stat.S_ISDIR(info.st_mode)
                  require(alias or directory or stat.S_ISREG(info.st_mode),
                          f"Unsupported file type: {name}")
                  require(directory or (not alias and omit_diagnostics) or info.st_nlink == 1,
                          f"Unsupported hard link: {name}")
                  kind = "func-alias" if alias else "directory" if directory else "file"
                  header = tarfile.TarInfo(name)
                  header.type, header.linkname = TAR_TYPES[kind], target if alias else ""
                  try:
                      header.tobuf(format=tarfile.USTAR_FORMAT)
                  except ValueError:
                      raise SystemExit("Output directory cannot be represented in USTAR") from None
                  size = 0 if directory or alias else info.st_size
                  source_total += size
                  require(source_total <= MAX_BYTES and len(entries) < MAX_ENTRIES,
                          "Output exceeds the 64 MiB / 4096 entry transfer limit")
                  content_hash = None
                  if kind == "file":
                      file_states[name] = regular_state(info)
                      data = regular_bytes(path, file_states[name])
                      if omit_diagnostics and name == BUILDS_PATH:
                          builds_hash = hashlib.sha256(data).hexdigest()  # Transient; never serialized.
                          data = project_builds(data)
                          size = len(data)
                      content_hash = hashlib.sha256(data).hexdigest()
                  total += size
                  require(total <= MAX_BYTES, "Output exceeds 64 MiB")
                  entry = {"path": name, "type": kind, "mode": 0o777 if alias else mode,
                           "size": size, "mtime": 0 if alias else int(info.st_mtime),
                           "sha256": content_hash}
                  if alias:
                      entry["target"] = target
                  entries.append(entry)
                  if directory:
                      for child in sorted(path.iterdir()):
                          visit(child, name + "/" + child.name)

              visit(root, "output")
              validate_aliases(entries)
              require(any(e["path"] == "output/config.json" and e["type"] == "file"
                          for e in entries), "Missing output/config.json")
              require(any(e["path"] == BUILDS_PATH and e["type"] == "file" for e in entries),
                      "Missing regular output/builds.json")
              return entries, diagnostics_state, file_states, builds_hash, trace_state

          def json_object(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, "Duplicate JSON key")
                  result[key] = value
              return result

          def finite_float(value):
              number = float(value)
              if not math.isfinite(number):
                  raise ValueError
              return number

          def invalid_constant(value):
              raise ValueError

          def strict_json(data):
              try:
                  return json.loads(data.decode("utf-8"), object_pairs_hook=json_object,
                                    parse_float=finite_float, parse_constant=invalid_constant)
              except (UnicodeError, ValueError, RecursionError):
                  raise SystemExit("Invalid metadata JSON") from None

          def project_builds(data):
              original = strict_json(data)
              require(isinstance(original, dict) and "error" not in original
                      and original.get("target") == "production"
                      and original.get("cliVersion") == "50.39.0"
                      and isinstance(original.get("builds"), list) and original["builds"]
                      and all(isinstance(build, dict) and "error" not in build
                              for build in original["builds"]), "Invalid original build controls")
              return BUILDS_JSON

          require(os.environ.get("GITHUB_REPOSITORY") == REPOSITORY, "Wrong repository")
          require(os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
                  and os.environ.get("GITHUB_REF") == "refs/heads/master", "Manual master only")
          sha = os.environ.get("GITHUB_SHA", "")
          require(re.fullmatch(r"[0-9a-f]{40}", sha), "Invalid SHA")
          provenance = {
              "repository": REPOSITORY, "sha": sha, "ci_run_id": number("CI_RUN_ID"),
              "ci_run_attempt": number("CI_RUN_ATTEMPT"), "build_run_id": number("GITHUB_RUN_ID"),
              "build_run_attempt": number("GITHUB_RUN_ATTEMPT"), "workflow_id": 256058391,
              "cli_version": "50.39.0", "settings_sha256": SETTINGS_SHA256,
          }
          selection = {
              "source": ".vercel/output", "payload": "output",
              "regular_files": "independent-bytes",
              "diagnostics": {"path": "output/diagnostics", "state": "absent",
                              "reason": "auxiliary diagnostics excluded for privacy"},
              "builds_json": {"path": BUILDS_PATH, "representation": "target-only"},
              "static_trace": {"path": TRACE_PATH, "state": "absent",
                               "reason": "auxiliary static trace excluded for privacy"},
          }
          directory = Path(os.environ["BUNDLE_DIR"])
          package = directory / PACKAGE
          mode = os.environ.get("BUNDLE_MODE")
          require(mode in {"pack", "verify"}, "Unknown transfer mode")

          if mode == "pack":
              workspace = Path(os.environ["GITHUB_WORKSPACE"])
              settings = workspace / ".vercel/project.json"
              require(not settings.is_symlink() and file_digest(settings) == SETTINGS_SHA256,
                      "Public settings changed after build")
              root = workspace / ".vercel/output"
              require(not (workspace / ".vercel").is_symlink(), "Unsupported settings-directory symlink")
              snapshot = inventory(root, omit_diagnostics=True)
              entries, diagnostics_state, file_states, builds_hash, trace_state = snapshot
              selection["diagnostics"]["state"] = diagnostics_state
              selection["static_trace"]["state"] = "absent" if trace_state is None else "omitted"
              receipt = json.dumps({"version": 5, "provenance": provenance,
                                    "selection": selection, "entries": entries},
                                   sort_keys=True, separators=(",", ":")).encode()
              require(len(receipt) <= MAX_RECEIPT, "Receipt exceeds 2 MiB")
              directory.mkdir()
              with tarfile.open(package, "w:", format=tarfile.USTAR_FORMAT) as archive:
                  header = tarfile.TarInfo("receipt.json")
                  header.size, header.mode = len(receipt), 0o600
                  archive.addfile(header, io.BytesIO(receipt))
                  for entry in entries:
                      header = tarfile.TarInfo(entry["path"])
                      header.type = TAR_TYPES[entry["type"]]
                      header.linkname = entry.get("target", "")
                      header.mode, header.size, header.mtime = entry["mode"], entry["size"], entry["mtime"]
                      if entry["type"] != "file":
                          archive.addfile(header)
                      else:
                          data = regular_bytes(root.parent / entry["path"], file_states[entry["path"]])
                          if entry["path"] == BUILDS_PATH:
                              require(hashlib.sha256(data).hexdigest() == builds_hash,
                                      "Original build metadata changed")
                              data = project_builds(data)
                          require(hashlib.sha256(data).hexdigest() == entry["sha256"],
                                  "Selected regular file content changed")
                          archive.addfile(header, io.BytesIO(data))
              require(package.stat().st_size <= MAX_PACKAGE, "Package exceeds 80 MiB")
              require(inventory(root, omit_diagnostics=True) == snapshot,
                      "Selected output changed while packaging")
              package_hash = file_digest(package)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"package_sha256={package_hash}\n")
              print(json.dumps({"provenance": provenance, "selection": selection, "entries": entries,
                                "source_regular_files_with_multiple_links": sum(
                                    state[3] > 1 for state in file_states.values()),
                                "payload_links": sum(e["type"] == "func-alias" for e in entries),
                                "bytes": sum(e["size"] for e in entries),
                                "package_bytes": package.stat().st_size, "package_sha256": package_hash}))
          else:
              artifact_id = number("ARTIFACT_ID")
              package_hash = os.environ.get("PACKAGE_SHA256", "")
              zip_digest = os.environ.get("ZIP_DIGEST", "")
              require(re.fullmatch(r"[0-9a-f]{64}", package_hash)
                      and re.fullmatch(r"[0-9a-f]{64}", zip_digest), "Invalid expected digest")
              api = f"https://api.github.com/repos/{REPOSITORY}"

              def get(path):
                  request = urllib.request.Request(api + path, headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2026-03-10",
                  }, method="GET")
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          result = json.load(response)
                  except (OSError, ValueError):
                      raise SystemExit("GitHub metadata GET failed") from None
                  require(isinstance(result, dict), "Invalid GitHub metadata")
                  return result

              run_id, attempt = provenance["build_run_id"], provenance["build_run_attempt"]
              expected_run = {"id": run_id, "run_attempt": attempt, "workflow_id": 256058391,
                              "path": ".github/workflows/vercel-production.yml",
                              "event": "workflow_dispatch", "head_branch": "master", "head_sha": sha}
              run = get(f"/actions/runs/{run_id}/attempts/{attempt}")
              latest = get(f"/actions/runs/{run_id}")
              for candidate in (run, latest):
                  require(all(candidate.get(k) == v for k, v in expected_run.items()),
                          "Wrong build run identity or attempt")
                  for key in ("repository", "head_repository"):
                      require(candidate.get(key, {}).get("full_name") == REPOSITORY,
                              "Foreign build repository")
              require(get("/git/ref/heads/master").get("object", {}).get("sha") == sha, "master moved")
              result = get(f"/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100")
              jobs = result.get("jobs", [])
              require(result.get("total_count") == len(jobs) == 2
                      and {j.get("name") for j in jobs} == {"production-build", "verify-production-bundle"},
                      "Incomplete or unexpected build jobs")
              producer = next(j for j in jobs if j.get("name") == "production-build")
              require(producer.get("run_id") == run_id and producer.get("run_attempt") == attempt
                      and producer.get("head_sha") == sha and producer.get("status") == "completed"
                      and producer.get("conclusion") == "success", "Producer job did not succeed")
              artifact = get(f"/actions/artifacts/{artifact_id}")
              artifact_name = f"production-bundle-{run_id}-{attempt}"
              require(artifact.get("id") == artifact_id and artifact.get("name") == artifact_name
                      and artifact.get("expired") is False
                      and artifact.get("digest") == "sha256:" + zip_digest,
                      "Wrong artifact identity or ZIP digest")
              origin = artifact.get("workflow_run", {})
              require(origin == {"id": run_id, "head_sha": sha, "head_branch": "master",
                                 "repository_id": run["repository"]["id"],
                                 "head_repository_id": run["head_repository"]["id"]},
                      "Artifact belongs to another run, revision or repository")
              require(not directory.is_symlink() and set(p.name for p in directory.iterdir()) == {PACKAGE}
                      and package.is_file() and not package.is_symlink()
                      and package.stat().st_size <= MAX_PACKAGE,
                      "Unexpected downloaded files or package size")
              require(file_digest(package) == package_hash, "Package SHA-256 mismatch")
              with tarfile.open(package, "r:") as archive:
                  members = {}
                  for member in archive:
                      require(len(members) < MAX_ENTRIES + 1 and member.name not in members,
                              "Duplicate or excessive archive entries")
                      require(member.type in TAR_TYPES.values()
                              and (member.issym() or not member.linkname) and not member.pax_headers
                              and not archive.pax_headers and not member.issparse(),
                              "Unsupported archive link, type or extended header")
                      require(member.uid == member.gid == 0 and not member.uname and not member.gname,
                              "Unexpected archive ownership metadata")
                      if member.name != "receipt.json":
                          output_path(member.name)
                      if member.issym():
                          alias_target(member.name, member.linkname)
                      members[member.name] = member
                  archive.fileobj.seek(archive.offset)
                  require(not any(archive.fileobj.read()), "Unexpected data after archive end")
                  header = members.get("receipt.json")
                  require(header is not None and header.isfile() and header.size <= MAX_RECEIPT,
                          "Missing or excessive receipt")
                  receipt = strict_json(archive.extractfile(header).read())
                  require(isinstance(receipt, dict)
                          and set(receipt) == {"version", "provenance", "selection", "entries"}
                          and type(receipt["version"]) is int and receipt["version"] == 5
                          and json.dumps(receipt["provenance"], sort_keys=True)
                          == json.dumps(provenance, sort_keys=True), "Receipt provenance mismatch")
                  require(isinstance(receipt["selection"], dict)
                          and isinstance(receipt["selection"].get("diagnostics"), dict)
                          and isinstance(receipt["selection"].get("static_trace"), dict),
                          "Invalid payload selection")
                  diagnostics_state = receipt["selection"]["diagnostics"].get("state")
                  require(diagnostics_state in ("absent", "omitted"), "Invalid diagnostics state")
                  selection["diagnostics"]["state"] = diagnostics_state
                  trace_state = receipt["selection"]["static_trace"].get("state")
                  require(trace_state in ("absent", "omitted"), "Invalid static trace state")
                  selection["static_trace"]["state"] = trace_state
                  require(receipt["selection"] == selection, "Unsupported payload selection")
                  entries = receipt["entries"]
                  require(isinstance(entries, list) and 0 < len(entries) <= MAX_ENTRIES,
                          "Invalid receipt inventory")
                  expected_names = {"receipt.json"}
                  total = 0
                  for entry in entries:
                      require(isinstance(entry, dict), "Invalid inventory entry")
                      alias = entry.get("type") == "func-alias"
                      require(set(entry) == {"path", "type", "mode", "size", "mtime", "sha256"}
                              | ({"target"} if alias else set()), "Invalid inventory fields")
                      name = entry["path"]
                      output_path(name)
                      require(name not in expected_names and name in members, "Missing or duplicate file")
                      expected_names.add(name)
                      member = members[name]
                      require(entry["type"] in ("file", "directory", "func-alias")
                              and member.type == TAR_TYPES[entry["type"]], "File type mismatch")
                      for key in ("mode", "size", "mtime"):
                          require(type(entry[key]) is int and entry[key] >= 0, "Invalid file metadata")
                      require(entry["mode"] <= 0o777 and member.mode == entry["mode"]
                              and member.size == entry["size"] and member.mtime == entry["mtime"],
                              "Archive metadata differs from inventory")
                      total += entry["size"]
                      require(total <= MAX_BYTES, "Output exceeds 64 MiB")
                      if member.isfile():
                          require(digest(archive.extractfile(member)) == entry["sha256"],
                                  "File content mismatch")
                      else:
                          require(entry["size"] == 0 and entry["sha256"] is None,
                                  "Invalid directory or alias metadata")
                      if alias:
                          require(entry["mode"] == 0o777 and entry["mtime"] == 0
                                  and member.linkname == entry["target"], "Invalid alias metadata")
                          alias_target(name, entry["target"])
                  require(set(members) == expected_names and "output" in expected_names
                          and members["output"].isdir() and "output/config.json" in expected_names
                          and members["output/config.json"].isfile()
                          and BUILDS_PATH in expected_names and members[BUILDS_PATH].isfile(),
                          "Unexpected or missing archive entries")
                  require(members[BUILDS_PATH].size == len(BUILDS_JSON)
                          and archive.extractfile(members[BUILDS_PATH]).read() == BUILDS_JSON,
                          "Non-canonical build metadata")
                  for entry in entries:
                      for parent in PurePosixPath(entry["path"]).parents:
                          if parent.as_posix() != ".":
                              require(parent.as_posix() in expected_names
                                      and members[parent.as_posix()].isdir(),
                                      "Missing or non-directory parent in inventory")
                  validate_aliases(entries)
                  # All structure checks precede filesystem writes; aliases are created last.
                  destination = Path(os.environ["EXTRACT_DIR"])
                  destination.mkdir()
                  for entry in sorted(entries, key=lambda e: e["path"]):
                      if entry["type"] == "func-alias":
                          continue
                      target = destination / entry["path"]
                      if entry["type"] == "directory":
                          target.mkdir()
                      else:
                          with target.open("xb") as stream:
                              stream.write(archive.extractfile(members[entry["path"]]).read())
                  for entry in entries:
                      if entry["type"] == "func-alias":
                          os.symlink(entry["target"], destination / entry["path"], target_is_directory=True)
                  for entry in sorted(entries, key=lambda e: e["path"], reverse=True):
                      if entry["type"] == "func-alias":
                          continue
                      target = destination / entry["path"]
                      os.chmod(target, entry["mode"])
                      os.utime(target, (entry["mtime"], entry["mtime"]))
              require(inventory(destination / "output")[:2] == (entries, "absent"),
                      "Restored content or metadata mismatch")
              print(json.dumps({"verified_payload": provenance, "selection": selection,
                                "artifact_id": artifact_id,
                                "artifact_name": artifact_name, "github_zip_digest": zip_digest,
                                "package_sha256": package_hash, "entries": len(entries), "bytes": total,
                                "payload_links": sum(e["type"] == "func-alias" for e in entries),
                                "executed_bundle": False}))
          PY

      - name: Upload production bundle
        id: bundle-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ridefare-transfer-upload/production-bundle.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  verify-production-bundle:
    runs-on: ubuntu-latest
    needs: production-build
    steps:
      - name: Require single artifact ID
        id: artifact-source
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.production-build.outputs.artifact_id }}
        run: |
          python3 -I -B - <<'PY'
          import os
          import re

          value = os.environ.get("ARTIFACT_ID", "")
          if not re.fullmatch(r"[1-9][0-9]*", value):
              raise SystemExit("A single explicit artifact ID is required")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"id={value}\n")
          PY

      - name: Download exact production bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.artifact-source.outputs.id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ridefare-transfer-received

      - name: Verify production bundle
        shell: bash
        env:
          BUNDLE_MODE: verify
          BUNDLE_DIR: ${{ runner.temp }}/ridefare-transfer-received
          EXTRACT_DIR: ${{ runner.temp }}/ridefare-transfer-verified
          ARTIFACT_ID: ${{ needs.production-build.outputs.artifact_id }}
          ZIP_DIGEST: ${{ needs.production-build.outputs.zip_digest }}
          PACKAGE_SHA256: ${{ needs.production-build.outputs.package_sha256 }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: *bundle-transfer
